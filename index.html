<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Color Me!</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/portal.css">
</head>
<body data-pal="title">
<div id="bgArt" aria-hidden="true">
  <span class="blob-bg b1"></span>
  <span class="blob-bg b2"></span>
  <span class="blob-bg b3"></span>
  <span class="blob-bg b4"></span>

  <!-- Decorative Studio Shapes -->
  <svg class="bg-shape s1" viewBox="0 0 80 80" fill="none">
    <circle cx="40" cy="40" r="26" stroke="#4C8DFF" stroke-width="10"/>
  </svg>
  <svg class="bg-shape s2" viewBox="0 0 80 80" fill="none">
    <path d="M40 10l8.5 17.5L68 30.3 53.8 44l3.4 19.4L40 54.2l-17.2 9.2 3.4-19.4L12 30.3l19.5-2.8L40 10z" fill="#FFC933"/>
  </svg>
  <svg class="bg-shape s3" viewBox="0 0 90 90" fill="none">
    <rect x="16" y="16" width="58" height="58" rx="18" stroke="#FF6B5E" stroke-width="10"/>
  </svg>
  <svg class="bg-shape s4" viewBox="0 0 120 50" fill="none">
    <path d="M10 32c14-18 28-18 42 0s28 18 42 0 14-12 18-8" stroke="#14B88C" stroke-width="9" stroke-linecap="round"/>
  </svg>
  <svg class="bg-shape s5" viewBox="0 0 80 80" fill="none">
    <path d="M40 14L68 62H12L40 14z" stroke="#8E5BE8" stroke-width="9" stroke-linejoin="round"/>
  </svg>
  <svg class="bg-shape s6" viewBox="0 0 80 80" fill="none">
    <circle cx="24" cy="28" r="10" fill="#FF8FC0"/>
    <circle cx="54" cy="24" r="7" fill="#4C8DFF"/>
    <circle cx="42" cy="54" r="12" fill="#FFC933"/>
  </svg>
  <svg class="bg-shape s7" viewBox="0 0 110 50" fill="none">
    <path d="M12 25h86M55 8v34" stroke="#FF8A2B" stroke-width="9" stroke-linecap="round"/>
  </svg>
  <svg class="bg-shape s8" viewBox="0 0 80 80" fill="none">
    <circle cx="40" cy="40" r="22" fill="#3CC15C"/>
  </svg>
</div>

<div id="wipe" aria-hidden="true">
  <div class="paint-band" style="--c:#F0464A;--d:0ms"></div>
  <div class="paint-band" style="--c:#FFC933;--d:40ms"></div>
  <div class="paint-band" style="--c:#3CC15C;--d:80ms"></div>
  <div class="paint-band" style="--c:#2F7BF5;--d:120ms"></div>
  <div class="paint-band" style="--c:#8E5BE8;--d:160ms"></div>
</div>
<div id="app">
  <header id="hd">
    <div class="brand-group">
      <button class="back-btn" id="backTitle" onclick="titleScreen()" aria-label="Back to title screen" title="Title Screen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <button class="logo" id="lg" onclick="brandClick()" aria-label="Color Me!"></button>
      <span class="role-tag" id="roleTag" style="display:none">Teacher</span>
    </div>
    <div class="nav" id="navStudent">
      <button class="nav-btn nav-home" id="navHome" onclick="home()" aria-label="Home" title="Home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V19a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9.5"/><path d="M9.5 20v-6h5v6"/></svg>
      </button>
      <button class="nav-btn nav-prof" id="navProf" onclick="profile()" aria-label="Profile" title="Profile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg>
      </button>
    </div>
    <div class="nav" id="navAdmin" style="display:none">
      <button class="pill-action" onclick="titleScreen()" title="Back to Title Screen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        <span>Title</span>
      </button>
      <button class="pill-action logout" onclick="logout()" title="Log out">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span>Log out</span>
      </button>
    </div>
  </header>
  <main id="main"></main>
</div>

<!-- Auth & Dashboard Modals -->
<div id="modalWrap" class="modal-wrap" aria-hidden="true">
  <div class="modal-card" id="modalBox" role="dialog" aria-modal="true"></div>
</div>

<!-- Pal the parrot -->
<aside id="pal" aria-live="polite">
  <div id="palBub" class="hide" role="button" tabindex="0" aria-label="Close speech bubble"></div>
  <img id="palImg" alt="Pal the parrot" src="palette/closed%20mouth.png">
</aside>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/accounts.js"></script>
<script src="js/teacher.js"></script>
<script src="js/app.js"></script>
</body></html>
